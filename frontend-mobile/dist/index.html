         AdSense rewrites the <ins> to whatever size it likes - on a slow

    <style>
      /* Static boot splash, painted from this file before any JavaScript runs.
         React's route skeleton cannot cover this window: the bundle still has to
         download and parse first, and until React mounts #root is empty. Measured
         cold, that was ~600ms of blank white page on a phone before the home
         layout appeared. This markup paints immediately and React replaces it. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f6f8f7;
        z-index: 9999;
      }
      #boot-splash .bs-mark {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #ffffff
          url('/mobile/forestry-logo-128.png') center / 62px 62px no-repeat;
        box-shadow: 0 2px 10px hsl(150 18% 20% / 0.1);
      }
      #boot-splash .bs-bar {
        width: 108px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: hsl(150 18% 20% / 0.1);
      }
      #boot-splash .bs-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #1f9d55;
        animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: hsl(150 18% 7%); }
        #boot-splash .bs-mark { box-shadow: 0 2px 10px hsl(0 0% 0% / 0.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-bar::after { animation: none; width: 100%; }
      }
      /* Keep the pre-render splash from flashing the wrong theme. */
      html.dark #boot-splash { background: hsl(150 18% 7%); }

    <script>
      (function(){
        // The slot keeps its height for the whole session. Collapsing it when
        // unfilled moved every pixel below — it was the single largest layout
        // shift on the page (0.08 of 0.09 total CLS, at ~1.6s, just as the
        // reader starts). Ads stay hidden during an exam, which is a
        // deliberate route change rather than an unrequested reflow.
        //
        // `display` is toggled on the pinned wrapper (#ad-slot-mobile), never on
        // the ad itself: AdSense owns that element's inline style, so writing to
        // it is how the page used to get shoved around.
        var slot = document.getElementById('ad-slot-mobile');
        var ad = document.getElementById('ad-top-mobile');
        var ins = ad ? ad.querySelector('ins.adsbygoogle') : null;

        // AdSense writes `height:auto !important` onto the slot *and* onto its
        // parent, so the wrapper cannot be pinned from a stylesheet - an inline
        // !important outranks every author rule. But it is the same element and
        // the same property, so the last writer wins: re-assert the height
        // whenever AdSense touches the attribute and the reserved space becomes
        // genuinely constant. The guard makes this idempotent, so re-writing
        // does not re-trigger the observer.
        var PIN = '69px';

        // Space is reserved only once an ad has actually filled. Reserving
        // it unconditionally is what left a permanent 69px hole between
        // the header and the first card on every page where no ad ever showed;
        // releasing it late instead just trades that hole for a layout shift.
        // `filled` is the only state where holding space is right, so it is the
        // only state where it is held: no ad means no reserved space, and
        // nothing on the page moves.
        var noAdComing = function () {
          if (!ins) return true;
          return ins.getAttribute('data-ad-status') !== 'filled';
        };
        var pinned = function(){
          if (!slot) return;
          var want = noAdComing() ? '0px' : PIN;
          // Exam routes hide the slot via set(): never reveal it here. The
          // exam check mirrors set()'s path test so the two cannot fight -
          // a filled ad during a timed paper stays hidden, always.
          var path = location.hash || location.pathname;
          var inExam = path.includes('/quiz') || path.includes('/attempt');
          var wantDisplay = (noAdComing() || inExam) ? 'none' : '';
          if (slot.style.display !== wantDisplay) slot.style.display = wantDisplay;
          if (slot.style.getPropertyValue('height') !== want ||
              slot.style.getPropertyPriority('height') !== 'important') {
            slot.style.setProperty('height', want, 'important');
          }
        };
        if (slot) {
          new MutationObserver(pinned).observe(slot, {
            attributes: true, attributeFilter: ['style'],
          });
        }

        var set = function(hidden){
          if (!ad || !slot) return;
          // Only write on change: each write invalidates style for the subtree.
          var want = hidden ? 'none' : '';
          if (slot.style.display !== want) slot.style.display = want;
          var filled = !!(ins && ins.getAttribute('data-ad-status') === 'filled');
          var empty = !filled || hidden;
          if (ad.classList.contains('ad-empty') !== empty) ad.classList.toggle('ad-empty', empty);
          // An unfilled slot cannot be tapped anyway; let touches pass through
          // so it never covers the fixed top bar. Restored when filled.
          var pe = (hidden || (ins && ins.getAttribute('data-ad-status') !== 'filled')) ? 'none' : '';
          if (ad.style.pointerEvents !== pe) ad.style.pointerEvents = pe;
        };

        var apply = function(){
          var path = location.hash || location.pathname;
          set(path.includes('/quiz') || path.includes('/attempt'));
          // Re-assert: this is the hook the 4s/9s retries and every
          // data-ad-status change go through, so the slot takes its space when an
          // ad fills and gives it back when one does not.
          pinned();
        };

        // Watch ONLY the ad subtree for `data-ad-status`. The old observer was
        // attached to document.body with subtree+childList, so it fired on every
        // DOM mutation React made anywhere in the app, re-running this each time.
        if (ins) {
          new MutationObserver(apply).observe(ins, {
            attributes: true, attributeFilter: ['data-ad-status'],
          });
        }
        window.addEventListener('hashchange', apply);
        setTimeout(apply, 4000);
        setTimeout(apply, 9000);
        // React Router navigates with pushState, which fires no hashchange and no
        // popstate - so leaving a timed exam left the slot `display:none` for the
        // rest of the session (until the 4s/9s retries). Two cheap signals cover
        // it: re-test on every client-side navigation (wrapped history methods,
        // which keep their original behaviour and return value), and re-test when
        // the QuizTaker marks an exam with a class on <html>.
        ['pushState', 'replaceState'].forEach(function (name) {
          var orig = history[name];
          if (typeof orig !== 'function') return;
          history[name] = function () {
            var out = orig.apply(this, arguments);
            apply();
            return out;
          };
        });
        window.addEventListener('popstate', apply);
        try {
          new MutationObserver(apply).observe(document.documentElement, {
            attributes: true, attributeFilter: ['class'],
          });
        } catch (e) {}
        apply();
        pinned();
        setTimeout(pinned, 1500);
        setTimeout(pinned, 4000);
      })();
    </script>
