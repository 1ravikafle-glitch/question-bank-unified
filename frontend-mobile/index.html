  <body>
    <div id="ad-top-mobile">
      <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-7976760719077018" data-ad-slot="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        var collapseEmpty = function(){
          var ad = document.getElementById('ad-top-mobile');
          if (!ad) return;
          var ins = ad.querySelector('ins.adsbygoogle');
          if (ins && ins.getAttribute('data-ad-status') === 'unfilled') {
            ad.style.display = 'none';
            return;
          }
          var path = location.hash || location.pathname;
          var isQuiz = path.includes('/quiz') || path.includes('/attempt');
          ad.style.display = isQuiz ? 'none' : '';
        };
        var obs = new MutationObserver(function(){ collapseEmpty(); });
        obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['data-ad-status']});
        setTimeout(collapseEmpty, 4000);
        setTimeout(collapseEmpty, 9000);
      })();
    </script>
  </body>
