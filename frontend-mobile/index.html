        <meta name="google-adsense-account" content="ca-pub-7976760719077018" />

        <script>
              // AdSense loader, gated by route. Auto Ads inserts ads wherever its
              // scanner likes, and the ONE placement that genuinely harms this app is
              // inside a timed exam - between the question and its options, or as an
              // interstitial over the paper. The loader is therefore not injected at
              // all on the exam routes, so a refresh or deep link into the exam is
              // guaranteed ad-free. (Client-side navigation keeps an already-loaded
              // loader alive; the manual banner still hides on those routes, and the
              // AdSense dashboard settings must stay conservative - see AUDIT.md.)
              // Same route test as the banner logic below. Do not revert.
              (function () {
                var p = location.pathname || '';
                if (p.indexOf('/quiz') !== -1 || p.indexOf('/attempt') !== -1) return;
                var s = document.createElement('script');
                s.async = true;
                s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7976760719077018';
                s.crossOrigin = 'anonymous';
                document.head.appendChild(s);
              })();
              </script>
    <style>
      #ad-top-mobile{width:100%;text-align:center;background:rgba(18,36,27,0.95);border-bottom:1px solid rgba(255,255,255,0.06);padding:6px 0;position:relative;z-index:100}
      /* Space is reserved so the page never jumps, but an unfilled slot must be
         invisible rather than an empty dark band. */
      #ad-top-mobile.ad-empty{background:transparent;border-bottom-color:transparent}
      #ad-top-mobile{max-height:130px;overflow:hidden}
      #ad-top-mobile:empty{display:none}
    </style>

  <body>
    <div id="ad-top-mobile" class="ad-empty">
      <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-7976760719077018" data-ad-slot="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        // The slot keeps its height for the whole session. Collapsing it when
        // unfilled moved every pixel below — it was the single largest layout
        // shift on the page (0.08 of 0.09 total CLS, at ~1.6s, just as the
        // reader starts). Ads stay hidden during an exam, which is a
        // deliberate route change rather than an unrequested reflow.
        var ad = document.getElementById('ad-top-mobile');
        var ins = ad ? ad.querySelector('ins.adsbygoogle') : null;

        var set = function(hidden){
          if (!ad) return;
          // Only write on change: each write invalidates style for the subtree.
          var want = hidden ? 'none' : '';
          if (ad.style.display !== want) ad.style.display = want;
          var filled = !!(ins && ins.getAttribute('data-ad-status') === 'filled');
          var empty = !filled || hidden;
          if (ad.classList.contains('ad-empty') !== empty) ad.classList.toggle('ad-empty', empty);
          // An unfilled slot cannot be tapped anyway; let touches pass through
          // so it never covers the fixed top bar. Restored when filled.
          var pe = (hidden || (ins && ins.getAttribute('data-ad-status') !== 'filled')) ? 'none' : '';
          if (ad.style.pointerEvents !== pe) ad.style.pointerEvents = pe;
        };

        var apply = function(){
          var path = location.hash || location.pathname;
          set(path.includes('/quiz') || path.includes('/attempt'));
        };

        // Watch ONLY the ad subtree for `data-ad-status`. The old observer was
        // attached to document.body with subtree+childList, so it fired on every
        // DOM mutation React made anywhere in the app, re-running this each time.
        if (ins) {
          new MutationObserver(apply).observe(ins, {
            attributes: true, attributeFilter: ['data-ad-status'],
          });
        }
        window.addEventListener('hashchange', apply);
        setTimeout(apply, 4000);
        setTimeout(apply, 9000);
        apply();
      })();
    </script>
