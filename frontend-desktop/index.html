<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12241B" />
    <meta name="description" content="Question Bank — practice MCQs for Forestry PSC field exams." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Question Bank — Forestry PSC MCQ Practice</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7976760719077018" crossorigin="anonymous"></script>
    <style>
      #ad-top-inline{width:100%;text-align:center;background:rgba(18,36,27,0.95);border-bottom:1px solid rgba(255,255,255,0.06);padding:8px 0;position:relative;z-index:100}
    </style>
  </head>
  <body>
    <div id="ad-top-inline">
      <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px" data-ad-client="ca-pub-7976760719077018" data-ad-slot="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        var obs = new MutationObserver(function(){
          var ad = document.getElementById('ad-top-inline');
          if (!ad) return;
          var path = location.hash || location.pathname;
          var isQuiz = path.includes('/quiz') || path.includes('/attempt');
          ad.style.display = isQuiz ? 'none' : '';
        });
        obs.observe(document.body, {childList:true, subtree:true});
      })();
    </script>
  </body>
</html>
