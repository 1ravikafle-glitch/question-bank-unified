services:
  - type: web
    name: question-bank-app
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python start_prod.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: question-bank-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: "Elfak"
      - key: ADMIN_PASSWORD
        value: "Kafle"
  - type: psql
    name: question-bank-db
    plan: free
    postgresVersion: "15"
