services:
  - type: web
    name: question-bank-app
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python start_prod.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
